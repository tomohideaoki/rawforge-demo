<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GlobalParents School Communication</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#172333;background:#f5f7fb}*{box-sizing:border-box}main{max-width:820px;margin:32px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 8px 32px #14233a12}h1{margin:0;font-size:28px}p{color:#526071}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650;margin:16px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #c7d0dc;border-radius:9px;font:inherit}textarea{min-height:200px;line-height:1.6}button{background:#244dd3;color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer;margin-top:14px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8cb3ff}section{margin-top:22px}#translation{white-space:pre-wrap;background:#f4f6fb;padding:16px;border-radius:10px;line-height:1.7}#status{color:#185b35}small{color:#526071}@media(max-width:600px){main{margin:0;padding:18px;border-radius:0}.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>GlobalParents School Communication</h1><p>学校への連絡文を作成する試作品です。送信は自動では行われません。</p><div class="grid"><div><label for="type">連絡の種類</label><select id="type"><option value="absence">欠席</option><option value="late">遅刻</option><option value="early">早退</option></select></div><div><label for="date">日付</label><input id="date" type="date"></div></div><div class="grid"><div><label for="name">子どもの名前（任意）</label><input id="name" maxlength="80" placeholder="例：Alex"></div><div><label for="time">予定時刻（遅刻・早退の場合）</label><input id="time" type="time"></div></div><section><label for="english">英文（編集できます）</label><textarea id="english" spellcheck="true"></textarea><button id="copy" type="button">英文をコピー</button> <span id="status" role="status" aria-live="polite"></span></section><section><h2>日本語訳（生成時の内容）</h2><div id="translation"></div><small>英文を手動で編集した場合、日本語訳は自動更新されません。送信前に内容を確認してください。</small></section><p><small>このページはブラウザ内で文章を組み立てます。入力内容の保存や学校への送信は行いません。</small></p></main><script>
const $=id=>document.getElementById(id);const type=$('type'),date=$('date'),name=$('name'),time=$('time'),english=$('english'),translation=$('translation'),status=$('status');
const localDate=new Date();const yyyy=localDate.getFullYear(),mm=String(localDate.getMonth()+1).padStart(2,'0'),dd=String(localDate.getDate()).padStart(2,'0');date.value=`${yyyy}-${mm}-${dd}`;
function formatDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return {en:'the specified date',ja:'指定日'};const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return {en:'the specified date',ja:'指定日'};return {en:dt.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}),ja:`${y}年${m}月${d}日`}}
function generate(){status.textContent='';const n=name.value.trim();const safe=n||'My child';const jaName=n||'子ども';const d=formatDate(date.value);const t=time.value;let subject,body,japanese;if(type.value==='absence'){subject='Absence Notification';body=`${safe} will be absent from school on ${d.en}. Please let me know if there is anything we should prepare for their return.`;japanese=`${jaName}は${d.ja}に学校を欠席します。復帰に向けて準備することがあれば教えてください。`;}else if(type.value==='late'){subject='Late Arrival Notification';body=`${safe} will arrive late to school on ${d.en}${t?` at approximately ${t}`:''}. Thank you for your understanding.`;japanese=`${jaName}は${d.ja}に遅刻します${t?`（到着予定時刻：${t}）`:''}。ご理解ありがとうございます。`;}else{subject='Early Departure Notification';body=`${safe} will need to leave school early on ${d.en}${t?` at approximately ${t}`:''}. Please let me know if any arrangements are needed.`;japanese=`${jaName}は${d.ja}に早退する必要があります${t?`（早退予定時刻：${t}）`:''}。必要な手続きがあれば教えてください。`;}english.value=`Subject: ${subject}\n\nHello,\n\n${body}\n\nThank you.`;translation.textContent=`件名：${type.options[type.selectedIndex].text}\n\nこんにちは。\n\n${japanese}\n\nよろしくお願いいたします。`}
[type,date,name,time].forEach(el=>el.addEventListener('input',generate));$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(english.value);status.textContent='コピーしました';}catch(e){english.focus();english.select();status.textContent='自動コピーできませんでした。Ctrl+Cでコピーしてください。';}});generate();
</script></body></html>
